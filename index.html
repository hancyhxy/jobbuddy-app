<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover,interactive-widget=resizes-content">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="JobBuddy">
  <title>JobBuddy</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script>document.documentElement.dataset.theme="light";</script>
</head>
<body>
  <button id="dir-toggle" class="dir-toggle" data-a="dir-toggle" aria-label="Toggle demo director" title="Demo director (D)"><span></span><span></span><span></span></button>
  <aside id="director" class="director" aria-label="Demo director"></aside>
  <div class="stage-wrap">
    <div class="phone">
      <main id="app" class="app"></main>
      <nav id="nav" class="nav"></nav>
      <div id="toast" class="toast" role="status"></div>
      <button id="badge-fab" class="badge-fab" data-a="badge-open" aria-label="Show Tappy">Tappy</button>
    </div>
    <aside id="badge" class="badge-panel" aria-label="Simulated event Tappy"></aside>
  </div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
