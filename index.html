<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#121212">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="JobBuddy">
  <title>JobBuddy</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <script>(function(){var p=localStorage.getItem("jobbuddy-theme")||"system";document.documentElement.dataset.theme=p==="system"?(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark"):p;})();</script>
</head>
<body>
  <div class="stage-wrap">
    <div class="phone">
      <main id="app" class="app"></main>
      <nav id="nav" class="nav"></nav>
      <div id="toast" class="toast" role="status"></div>
      <button id="badge-fab" class="badge-fab" data-a="badge-open" aria-label="Show Tappy">Tappy</button>
    </div>
    <aside id="badge" class="badge-panel" aria-label="Simulated event Tappy"></aside>
  </div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
